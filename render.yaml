# Render.com Blueprint for Vanguard Neural Analysis Core
# Deploys the Python FastAPI backend + PostgreSQL for free

services:
  - type: web
    name: vanguard-api
    runtime: python
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: cd api && python run.py --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: vanguard-postgres
          property: connectionString

databases:
  - name: vanguard-postgres
    plan: free
    databaseName: vanguard_db
    user: vanguard_user
    postgreSqlVersion: "15"