services:
  - type: web
    name: vanguard-api-v3
    runtime: python
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: cd api && python run.py --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: vanguard-postgres-v3
          property: connectionString

databases:
  - name: vanguard-postgres-v3
    plan: free
    databaseName: vanguard_db_v3
    user: vanguard_user_v3
    postgreSqlVersion: "15"

